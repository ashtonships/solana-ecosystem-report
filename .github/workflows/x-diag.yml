name: X diagnostics
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe recent-search metadata
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["X_BEARER_TOKEN"]
          accounts = ["SolanaFndn", "solana", "anza_tech", "firedancer_io"]
          from_clause = " OR ".join(f"from:{n}" for n in accounts)
          query = urllib.parse.urlencode({
              "query": f"({from_clause}) -is:retweet -is:reply",
              "max_results": 10,
              "tweet.fields": "id,author_id,text,created_at,public_metrics",
          })
          request = urllib.request.Request(
              f"https://api.x.com/2/tweets/search/recent?{query}",
              headers={"Authorization": f"Bearer {token}",
                       "User-Agent": "solana-ecosystem-report/0.1"})
          try:
              with urllib.request.urlopen(request, timeout=20) as r:
                  body = json.loads(r.read().decode())
                  print("HTTP OK")
                  print("result_count:", body.get("meta", {}).get("result_count"))
                  print("error keys:", [k for k in body.keys() if k != "data"])
                  data = body.get("data")
                  print("rows:", len(data) if isinstance(data, list) else "none")
                  if isinstance(data, list):
                      for row in data[:3]:
                          print("  -", row.get("author_id"), str(row.get("text"))[:50])
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:300])
          PY
