name: Dune diagnostics
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe latest-result row shape
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          request = urllib.request.Request(
              "https://api.dune.com/api/v1/query/8590950/results?limit=2",
              headers={"X-DUNE-API-KEY": os.environ["DUNE_API_KEY"]})
          with urllib.request.urlopen(request, timeout=30) as r:
              body = json.loads(r.read().decode())
          result = body.get("result", {})
          rows = result.get("rows", [])
          print("rows:", len(rows))
          if rows:
              row = rows[0]
              for k, v in row.items():
                  print(f"  {k}: {type(v).__name__} = {str(v)[:60]}")
          else:
              print("NO ROWS. body keys:", list(body.keys()))
              print("result keys:", list(result.keys()))
          PY
